<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="favCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="favAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Left Wave Arc -->
  <path d="M 20 60 C 20 40, 32 24, 48 18 C 36 26, 28 42, 28 60 C 28 78, 36 94, 48 102 C 32 96, 20 80, 20 60 Z"
        fill="url(#favCyan)" opacity="0.9" />

  <!-- Right Wave Arc -->
  <path d="M 100 60 C 100 40, 88 24, 72 18 C 84 26, 92 42, 92 60 C 92 78, 84 94, 72 102 C 88 96, 100 80, 100 60 Z"
        fill="url(#favGrad)" opacity="0.9" />

  <!-- Neural M Core -->
  <path d="M 36 84 L 36 40 C 36 34, 42 30, 48 35 L 60 48 L 72 35 C 78 30, 84 34, 84 40 L 84 84"
        stroke="url(#favGrad)"
        stroke-width="8.5"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Frequency Bars -->
  <line x1="48" y1="58" x2="48" y2="78" stroke="url(#favCyan)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="60" y1="52" x2="60" y2="86" stroke="url(#favAccent)" stroke-width="5" stroke-linecap="round" />
  <line x1="72" y1="58" x2="72" y2="78" stroke="url(#favGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Nodes -->
  <circle cx="60" cy="48" r="5" fill="url(#favAccent)" />
  <circle cx="36" cy="40" r="4" fill="#38bdf8" />
  <circle cx="84" cy="40" r="4" fill="#c084fc" />
  <circle cx="36" cy="84" r="4.5" fill="#6366f1" />
  <circle cx="84" cy="84" r="4.5" fill="#a855f7" />
</svg>
