<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Vibrant Multi-stop AI Gradients -->
    <linearGradient id="aiGradPrimary" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="aiGradCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="aiGradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Micro Aura (Transparent, subtle soft glow) -->
  <circle cx="60" cy="60" r="42" fill="url(#aiGradPrimary)" opacity="0.12" filter="url(#softGlow)" />

  <!-- Outer Orbiting Soundwave Arc Left -->
  <path d="M 22 60 C 22 42, 33 26, 48 20 C 37 28, 30 43, 30 60 C 30 77, 37 92, 48 100 C 33 94, 22 78, 22 60 Z"
        fill="url(#aiGradCyan)" opacity="0.85" />

  <!-- Outer Orbiting Soundwave Arc Right -->
  <path d="M 98 60 C 98 42, 87 26, 72 20 C 83 28, 90 43, 90 60 C 90 77, 83 92, 72 100 C 87 94, 98 78, 98 60 Z"
        fill="url(#aiGradPrimary)" opacity="0.85" />

  <!-- Stylized Geometric "M" Neural Ribbon Core -->
  <path d="M 38 82 L 38 42 C 38 37, 43 33, 48 37 L 60 49 L 72 37 C 77 33, 82 37, 82 42 L 82 82"
        stroke="url(#aiGradPrimary)"
        stroke-width="7.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#softGlow)" />

  <!-- Audio Wave Frequency Bars in Center Nexus -->
  <line x1="49" y1="58" x2="49" y2="76" stroke="url(#aiGradCyan)" stroke-width="4" stroke-linecap="round" opacity="0.9" />
  <line x1="60" y1="52" x2="60" y2="84" stroke="url(#aiGradAccent)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="71" y1="58" x2="71" y2="76" stroke="url(#aiGradPrimary)" stroke-width="4" stroke-linecap="round" opacity="0.9" />

  <!-- Neural Audio Nodes -->
  <circle cx="60" cy="49" r="4.5" fill="url(#aiGradAccent)" filter="url(#softGlow)" />
  <circle cx="38" cy="42" r="3.5" fill="#38bdf8" />
  <circle cx="82" cy="42" r="3.5" fill="#c084fc" />
  <circle cx="38" cy="82" r="4" fill="#6366f1" />
  <circle cx="82" cy="82" r="4" fill="#a855f7" />
</svg>
